/* TARJETAS GLASSMORPHISM */
.channel-card {
  position: relative;

  border-radius: 16px;
  padding: 15px;
  text-align: center;

  -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 160px;
}

.channel-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%);
  transform: skewX(-25deg);
  transition: all 0.6s ease;
}

.channel-card:hover {
  transform: translateY(-8px) scale(1.02);
  background: var(--glass-hover);
  border-color: rgba(207, 168, 94, 0.3);
  box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 20px var(--neon-glow);
}

.channel-card:hover::before {
  left: 200%;
}

.channel-card img {

  height: 90px;
  object-fit: contain;
  transition: transform 0.4s ease;

const originalHome = grid.innerHTML;




const showChannels = `

function animateCards(){
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){entry.target.classList.add("show")}
})
})
document.querySelectorAll(".channel-card").forEach(card=>observer.observe(card))
}

animateCards()


// DYNAMIC CATEGORY INJECTION
if (typeof premiumDatabase !== 'undefined') {
    const desktopCatContainer = document.getElementById('desktop-categories-container');
    const mobileCatContainer = document.getElementById('mobile-categories-container');
    const cats = Array.from(new Set(premiumDatabase.map(c => c.category))).sort();
    let desktopHtml = '';
    let mobileHtml = '';
    cats.forEach(cat => {
        if (!cat) return;
        let catID = 'cat_' + cat.replace(/ /g, '_');
        desktopHtml += `<button class="menu-btn" data-page="${catID}" style="font-size:12px;">${cat}</button>\n`;
        mobileHtml += `<button class="menu-btn block w-full text-left p-2 hover:bg-[#129505] rounded" data-page="${catID}">${cat}</button>\n<div style="height:1px;background:#bea67a;margin:4px 0;"></div>\n`;
    });
    if (desktopCatContainer) desktopCatContainer.innerHTML = desktopHtml;
    if (mobileCatContainer) mobileCatContainer.innerHTML = mobileHtml;
}

// EVENT DELEGATION INSTEAD OF QUERY SELECTOR
document.body.addEventListener("click", function(e) {
let btn = e.target.closest(".menu-btn");
if(!btn) return;


document.querySelectorAll(".menu-btn").forEach(b=>b.classList.remove("active"))
btn.classList.add("active")

const page = btn.dataset.page


if(page==="home"){
grid.innerHTML = originalHome
} else if(page==="peliculas"){
renderMovies();
} else if(page==="series"){
renderSeries();
} else if(page==="nacional"){
renderNacionalChannels();
} else if(page.startsWith("cat_")){
renderCategory(page.replace("cat_", "").replace(/_/g, " "));
}



animateCards()
document.getElementById("mobile-menu").classList.add("hidden")
filterChannels()

})


document.getElementById("menu-toggle").onclick = ()=>{
document.getElementById("mobile-menu").classList.toggle("hidden")
}

const dtToggle = document.getElementById("desktop-menu-toggle");
if(dtToggle) {
    dtToggle.onclick = () => {
        document.querySelector(".menu").classList.toggle("collapsed");
    };
}


function filterChannels(){
let value = (document.getElementById("searchInput")?.value || document.getElementById("searchInputMobile")?.value || "").toLowerCase();

document.querySelectorAll(".channel-card").forEach(card=>{
    let text = card.innerText.toLowerCase() + " " + (card.dataset.name || "");
    card.style.display = text.includes(value) ? "" : "none";
});

// Hide category headers if no visible items below them
document.querySelectorAll(".category-header-wrap").forEach(wrap => {
    let hasVisible = false;
    let next = wrap.nextElementSibling;
    while(next && next.classList.contains('channel-card')) {
        if(next.style.display !== 'none') {
            hasVisible = true;
            break;
        }
        next = next.nextElementSibling;
    }
    wrap.style.display = hasVisible ? 'block' : 'none';
});
}

if(document.getElementById("searchInput")) document.getElementById("searchInput").addEventListener("keyup",filterChannels);
if(document.getElementById("searchInputMobile")) document.getElementById("searchInputMobile").addEventListener("keyup",filterChannels);

</script>

<script>
    let lastScrollPosition = 0;
    let hls = null;
    
    function playChannel(url) {
        lastScrollPosition = window.scrollY || document.documentElement.scrollTop;
        const wrapper = document.getElementById('player-wrapper');
        const player = document.getElementById('main-player');
        const video = document.getElementById('native-player');
        
        if (video) video.style.display = 'none';
        if(hls) { hls.destroy(); }
        if (video) video.pause();
        
        player.style.display = 'block';
        player.src = url;
        
        wrapper.style.display = 'block';
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    
    function playVipChannel(url) {
        let proxyUrl = url;
        // Solo enviar por proxy los enlaces HTTP para evitar Mixed Content.
        // Los HTTPS se reproducen de forma nativa para evitar los cortes de 10s de Vercel.
        if (url.startsWith('http://')) {
            proxyUrl = '/api/proxy?url=' + encodeURIComponent(url);
        }

        lastScrollPosition = window.scrollY || document.documentElement.scrollTop;
        const wrapper = document.getElementById('player-wrapper');
        const player = document.getElementById('main-player');
        const video = document.getElementById('native-player');
        
        player.style.display = 'none';
        player.src = '';
        video.style.display = 'block';
        
        // Clean up old players
        if(typeof hls !== 'undefined' && hls) {
            hls.destroy();
            hls = null;
        }
        if(typeof mpegtsPlayer !== 'undefined' && mpegtsPlayer) {
            mpegtsPlayer.destroy();
            mpegtsPlayer = null;
        }

        // Check format: attbr.fun fakes m3u8 but returns raw TS streams
        let isRawTs = url.includes('.ts') || url.includes('attbr.fun') || url.includes('cloudmail.site');

        if (isRawTs && typeof mpegts !== 'undefined' && mpegts.getFeatureList().mseLivePlayback) {
            mpegtsPlayer = mpegts.createPlayer({
                type: 'm2ts',
                isLive: true,
                url: proxyUrl
            });
            mpegtsPlayer.attachMediaElement(video);
            mpegtsPlayer.load();
            mpegtsPlayer.play();
        } 
        else if (typeof Hls !== 'undefined' && Hls.isSupported() && url.includes(".m3u8")) {
            hls = new Hls();
            hls.loadSource(proxyUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = proxyUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        } else {
            video.src = proxyUrl;
            video.play();
        }
        
        wrapper.style.display = 'block';
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function closePlayer() {
        document.getElementById('player-wrapper').style.display = 'none';
        document.getElementById('main-player').src = '';
        const video = document.getElementById('native-player');
        if (video) {
            video.pause();
            video.src = '';
        }
        if(typeof hls !== 'undefined' && hls) { hls.destroy(); hls = null; }
        if(typeof mpegtsPlayer !== 'undefined' && mpegtsPlayer) { mpegtsPlayer.destroy(); mpegtsPlayer = null; }
        window.scrollTo({ top: lastScrollPosition, behavior: 'smooth' });
    }


function renderNacionalChannels() {
    if (typeof vipDatabase === 'undefined' || vipDatabase.length === 0) {
        grid.innerHTML = '<h3 style="color:red; text-align:center; width:100%;">No hay canales nacionales disponibles.</h3>';
        return;
    }

    let html = '';
    vipDatabase.forEach(c => {
        html += `
        <a href="javascript:void(0)" class="channel-card" onclick="playVipChannel('${c.url}')">
          <div class="live"><span class="live-dot"></span>EN VIVO</div>
          <img src="${c.logo}" alt="${c.name}" style="border-radius:10px;" onerror="this.src='https://ui-avatars.com/api/?name=TV&background=ffd700&color=000&size=128'">
          <p class="channel-name">${c.name}</p>
        </a>`;
    });
    
    grid.innerHTML = html;
    animateCards();
}
